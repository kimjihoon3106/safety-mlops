name: Build container images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "pipeline/**"
      - "docker/**"
      - ".github/workflows/build-images.yaml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 323974325951.dkr.ecr.ap-northeast-2.amazonaws.com

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: inference-api
            repository: inference-api
            tag-prefix: sha-
            dockerfile: docker/inference-api/Dockerfile
          - name: dataset-watcher
            repository: dataset-watcher
            tag-prefix: sha-
            dockerfile: docker/dataset-watcher/Dockerfile
          - name: mlflow
            repository: mlflow
            tag-prefix: sha-
            dockerfile: docker/mlflow/Dockerfile
          - name: trainer
            repository: trainer
            tag-prefix: sha-
            dockerfile: docker/trainer/Dockerfile
          - name: model-operator
            repository: trainer
            tag-prefix: model-operator-sha-
            dockerfile: docker/model-operator/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::323974325951:role/safety-mlops-github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/safety-mlops/${{ matrix.repository }}:${{ matrix.tag-prefix }}${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
