apiVersion: v1
kind: Service
metadata:
  name: optuna-postgresql
  namespace: mlops
spec:
  selector:
    app: optuna-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: optuna-postgresql
  namespace: mlops
spec:
  serviceName: optuna-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: optuna-postgresql
  template:
    metadata:
      labels:
        app: optuna-postgresql
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgresql
          image: postgres:16.6-bookworm
          imagePullPolicy: IfNotPresent
          env:
            - {name: POSTGRES_DB, value: optuna}
            - {name: POSTGRES_USER, value: optuna}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: optuna-postgresql
                  key: password
          ports:
            - {name: postgresql, containerPort: 5432}
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U optuna -d optuna"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -U optuna -d optuna"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
