apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      containers:
        - name: mlflow
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - mlflow
            - server
            - --backend-store-uri
            - sqlite:////mlflow/db/mlflow.db
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.service.port }}"
            - --serve-artifacts
            - --artifacts-destination
            - s3://{{ required "s3.bucket is required" .Values.s3.bucket }}/{{ .Values.s3.artifactPrefix }}
          env:
            - name: AWS_PROFILE
              value: roles-anywhere
            - name: AWS_CONFIG_FILE
              value: /var/run/aws-ra/config/config
            - name: AWS_SDK_LOAD_CONFIG
              value: "1"
            - name: AWS_DEFAULT_REGION
              value: ap-northeast-2
            - name: AWS_REGION
              value: ap-northeast-2
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: database
              mountPath: /mlflow/db
            - {name: aws-ra-config, mountPath: /var/run/aws-ra/config, readOnly: true}
            - {name: aws-ra-tls, mountPath: /var/run/aws-ra/tls, readOnly: true}
            - {name: aws-signing-helper, mountPath: /usr/local/bin/aws_signing_helper, readOnly: true}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}
        - {name: aws-ra-config, configMap: {name: aws-roles-anywhere-config}}
        - {name: aws-ra-tls, secret: {secretName: aws-roles-anywhere-x509, defaultMode: 288}}
        - {name: aws-signing-helper, hostPath: {path: /usr/local/bin/aws_signing_helper, type: File}}
