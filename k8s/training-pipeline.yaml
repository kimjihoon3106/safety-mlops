apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: mlops-serving-high
value: 100000
globalDefault: false
description: Keep production Triton serving ahead of batch training.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: safety-trainer
  namespace: mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: safety-trainer
  namespace: mlops
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["training-candidate"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: safety-trainer
  namespace: mlops
subjects:
  - kind: ServiceAccount
    name: safety-trainer
    namespace: mlops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: safety-trainer
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: safety-training-template
  namespace: mlops
spec:
  schedule: "0 0 31 2 *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: safety-training
        spec:
          serviceAccountName: safety-trainer
          imagePullSecrets:
            - name: ecr-registry
          restartPolicy: Never
          containers:
            - name: trainer
              image: 323974325951.dkr.ecr.ap-northeast-2.amazonaws.com/safety-mlops/trainer:sha-e597ec0545baa2a0b17535c4b54acbc97882a2b2
              imagePullPolicy: IfNotPresent
              env:
                - name: DATASET_S3_URI
                  valueFrom:
                    configMapKeyRef:
                      name: training-candidate
                      key: s3_uri
                - name: DATASET_VERSION
                  valueFrom:
                    configMapKeyRef:
                      name: training-candidate
                      key: dataset_version
                - name: S3_BUCKET
                  value: mlops-safety-323974325951-ap-northeast-2
                - name: MLFLOW_TRACKING_URI
                  value: http://mlflow.mlops.svc.cluster.local:5000
                - name: BASE_MODEL
                  value: yolov8s.pt
                - name: EPOCHS
                  value: "50"
                - name: IMAGE_SIZE
                  value: "640"
                - name: BATCH_SIZE
                  value: "8"
                - {name: AWS_PROFILE, value: roles-anywhere}
                - {name: AWS_CONFIG_FILE, value: /var/run/aws-ra/config/config}
                - {name: AWS_SDK_LOAD_CONFIG, value: "1"}
                - name: AWS_DEFAULT_REGION
                  value: ap-northeast-2
                - {name: AWS_REGION, value: ap-northeast-2}
              resources:
                requests:
                  cpu: "2"
                  memory: 4Gi
                  nvidia.com/gpu: "1"
                limits:
                  memory: 7Gi
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: work
                  mountPath: /work
                - {name: aws-ra-config, mountPath: /var/run/aws-ra/config, readOnly: true}
                - {name: aws-ra-tls, mountPath: /var/run/aws-ra/tls, readOnly: true}
                - {name: aws-signing-helper, mountPath: /usr/local/bin/aws_signing_helper, readOnly: true}
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 8Gi
            - {name: aws-ra-config, configMap: {name: aws-roles-anywhere-config}}
            - {name: aws-ra-tls, secret: {secretName: aws-roles-anywhere-x509, defaultMode: 256}}
            - {name: aws-signing-helper, hostPath: {path: /usr/local/bin/aws_signing_helper, type: File}}
