apiVersion: batch/v1
kind: CronJob
metadata:
  name: safety-smoke-test-template
  namespace: mlops
spec:
  schedule: "0 0 31 2 *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ecr-registry}]
          initContainers:
            - name: test-image-sync
              image: amazon/aws-cli:2.31.22
              command: ["aws", "s3", "cp", "s3://mlops-safety-323974325951-ap-northeast-2/smoke-tests/ppe.jpg", "/test/smoke.jpg", "--only-show-errors"]
              env:
                - {name: AWS_PROFILE, value: roles-anywhere}
                - {name: AWS_CONFIG_FILE, value: /var/run/aws-ra/config/config}
                - {name: AWS_SDK_LOAD_CONFIG, value: "1"}
                - {name: AWS_DEFAULT_REGION, value: ap-northeast-2}
                - {name: AWS_REGION, value: ap-northeast-2}
              volumeMounts:
                - {name: test, mountPath: /test}
                - {name: aws-ra-config, mountPath: /var/run/aws-ra/config, readOnly: true}
                - {name: aws-ra-tls, mountPath: /var/run/aws-ra/tls, readOnly: true}
                - {name: aws-signing-helper, mountPath: /usr/local/bin/aws_signing_helper, readOnly: true}
          containers:
            - name: smoke-test
              image: 323974325951.dkr.ecr.ap-northeast-2.amazonaws.com/safety-mlops/inference-api@sha256:e0242473fe9ddb53a7898ee94a505b38366b4f951a41880cb25ecd1a7535dfd7
              command: ["python", "/app/smoke_test.py"]
              env:
                - {name: TRITON_URL, value: "http://triton:8000"}
                - {name: API_URL, value: "http://inference-api:8080"}
                - name: EXPECTED_MODEL_VERSION
                  valueFrom: {configMapKeyRef: {name: safety-model-release, key: MODEL_VERSION}}
                - {name: MAX_LATENCY_MS, value: "5000"}
              volumeMounts: [{name: test, mountPath: /test, readOnly: true}]
          volumes:
            - {name: test, emptyDir: {sizeLimit: 20Mi}}
            - {name: aws-ra-config, configMap: {name: aws-roles-anywhere-config}}
            - {name: aws-ra-tls, secret: {secretName: aws-roles-anywhere-x509, defaultMode: 288}}
            - {name: aws-signing-helper, hostPath: {path: /usr/local/bin/aws_signing_helper, type: File}}
