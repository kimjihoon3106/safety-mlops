apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton
  template:
    metadata:
      labels:
        app: triton
      annotations:
        safety.mlops/model-version: v1
    spec:
      priorityClassName: mlops-serving-high
      initContainers:
        - name: model-sync
          image: amazon/aws-cli:2.31.22
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p "/models/${TRITON_MODEL_NAME}/${TRITON_MODEL_VERSION}"
              aws s3 cp "${MODEL_URI}" "/models/${TRITON_MODEL_NAME}/${TRITON_MODEL_VERSION}/model.plan" --only-show-errors
              aws s3 cp "${CONFIG_URI}" "/models/${TRITON_MODEL_NAME}/config.pbtxt" --only-show-errors
              echo "${MODEL_SHA256}  /models/${TRITON_MODEL_NAME}/${TRITON_MODEL_VERSION}/model.plan" | sha256sum -c -
          envFrom:
            - configMapRef:
                name: safety-model-release
          env:
            - {name: AWS_PROFILE, value: roles-anywhere}
            - {name: AWS_CONFIG_FILE, value: /var/run/aws-ra/config/config}
            - {name: AWS_SDK_LOAD_CONFIG, value: "1"}
            - {name: AWS_DEFAULT_REGION, value: ap-northeast-2}
            - {name: AWS_REGION, value: ap-northeast-2}
          volumeMounts:
            - name: model-repository
              mountPath: /models
            - {name: aws-ra-config, mountPath: /var/run/aws-ra/config, readOnly: true}
            - {name: aws-ra-tls, mountPath: /var/run/aws-ra/tls, readOnly: true}
            - {name: aws-signing-helper, mountPath: /usr/local/bin/aws_signing_helper, readOnly: true}
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:25.10-py3
          imagePullPolicy: IfNotPresent
          args:
            - tritonserver
            - --model-repository=/models
            - --disable-auto-complete-config
          ports:
            - name: http
              containerPort: 8000
            - name: grpc
              containerPort: 8001
            - name: metrics
              containerPort: 8002
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: model-repository
              mountPath: /models
              readOnly: true
      volumes:
        - name: model-repository
          emptyDir: {}
        - {name: aws-ra-config, configMap: {name: aws-roles-anywhere-config}}
        - {name: aws-ra-tls, secret: {secretName: aws-roles-anywhere-x509, defaultMode: 256}}
        - {name: aws-signing-helper, hostPath: {path: /usr/local/bin/aws_signing_helper, type: File}}
---
apiVersion: v1
kind: Service
metadata:
  name: triton
  namespace: mlops
spec:
  selector:
    app: triton
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: grpc
      port: 8001
      targetPort: grpc
    - name: metrics
      port: 8002
      targetPort: metrics
