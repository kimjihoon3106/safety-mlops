apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton
  template:
    metadata:
      labels:
        app: triton
    spec:
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:25.10-py3
          imagePullPolicy: IfNotPresent
          args:
            - tritonserver
            - --model-repository=/models
            - --disable-auto-complete-config
          ports:
            - name: http
              containerPort: 8000
            - name: grpc
              containerPort: 8001
            - name: metrics
              containerPort: 8002
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: model-repository
              mountPath: /models
              readOnly: true
      volumes:
        - name: model-repository
          hostPath:
            path: /home/ubuntu/mlops-stack/triton/model-repository
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: triton
  namespace: mlops
spec:
  selector:
    app: triton
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: grpc
      port: 8001
      targetPort: grpc
    - name: metrics
      port: 8002
      targetPort: metrics
