apiVersion: batch/v1
kind: CronJob
metadata:
  name: safety-evaluation-template
  namespace: mlops
spec:
  schedule: "0 0 31 2 *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: safety-evaluation
        spec:
          serviceAccountName: safety-trainer
          imagePullSecrets:
            - name: ecr-registry
          restartPolicy: Never
          containers:
            - name: evaluator
              image: 323974325951.dkr.ecr.ap-northeast-2.amazonaws.com/safety-mlops/trainer:sha-e597ec0545baa2a0b17535c4b54acbc97882a2b2
              imagePullPolicy: IfNotPresent
              command: ["python", "/app/evaluate_candidate.py"]
              env:
                - name: CANDIDATE_S3_URI
                  valueFrom:
                    configMapKeyRef:
                      name: training-candidate
                      key: candidate_s3_uri
                - name: PRODUCTION_METADATA_URI
                  valueFrom:
                    configMapKeyRef:
                      name: safety-model-release
                      key: METADATA_URI
                - {name: AWS_PROFILE, value: roles-anywhere}
                - {name: AWS_CONFIG_FILE, value: /var/run/aws-ra/config/config}
                - {name: AWS_SDK_LOAD_CONFIG, value: "1"}
                - name: AWS_DEFAULT_REGION
                  value: ap-northeast-2
                - {name: AWS_REGION, value: ap-northeast-2}
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                  nvidia.com/gpu: "1"
                limits:
                  memory: 4Gi
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: policy
                  mountPath: /policy
                  readOnly: true
                - name: work
                  mountPath: /work
                - {name: aws-ra-config, mountPath: /var/run/aws-ra/config, readOnly: true}
                - {name: aws-ra-tls, mountPath: /var/run/aws-ra/tls, readOnly: true}
                - {name: aws-signing-helper, mountPath: /usr/local/bin/aws_signing_helper, readOnly: true}
          volumes:
            - name: policy
              configMap:
                name: safety-model-evaluation-policy
            - name: work
              emptyDir:
                sizeLimit: 3Gi
            - {name: aws-ra-config, configMap: {name: aws-roles-anywhere-config}}
            - {name: aws-ra-tls, secret: {secretName: aws-roles-anywhere-x509, defaultMode: 288}}
            - {name: aws-signing-helper, hostPath: {path: /usr/local/bin/aws_signing_helper, type: File}}
